name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ainm
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: ainm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DB-gated tests self-skip when Postgres is unreachable; in CI the service
      # container guarantees they actually run — no silent skips.
      TEST_DATABASE_URL: postgres://ainm:dev_password@localhost:5432/ainm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace
      - name: assert DB tests were not skipped
        run: |
          # Guard against regressing to a Postgres-less run: the suite prints
          # "Skipping DB test" when it cannot connect.
          cargo test -p ainm-server --test integration 2>&1 | tee /tmp/itest.log
          if grep -q "Skipping DB test" /tmp/itest.log; then
            echo "::error::integration tests skipped Postgres — service container misconfigured"
            exit 1
          fi
