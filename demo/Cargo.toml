[package]
name = "ainm-demo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ainm-demo"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
ring = "0.17"
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
rustyline = "15"
colored = "3"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
anyhow = "1"
rand = "0.8"

# Federation: HTTP client for server-to-server relay
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# Federation: TLS configuration (direct dep for mTLS ServerConfig)
rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio-rustls = "0.26"
rustls-pki-types = "1.14"

# CLI argument parsing for federation mode
clap = { version = "4.6", features = ["derive"] }

# HTTP server for federation TLS listener (low-level hyper for axum TLS integration)
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = "0.5"
