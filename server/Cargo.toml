[package]
name = "ainm-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "ainm_server"
path = "src/lib.rs"

[[bin]]
name = "ainm-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
ring = "0.17"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rustyline = "15"
colored = "3"
base64 = "0.22"

# Accounts & identity binding (sub-project A)
# Pure escrow crypto (OPRF + Argon2id + HKDF + XChaCha20Poly1305) lives in the shared
# ainm-escrow crate, used verbatim by both the server and the iOS FFI client.
ainm-escrow = { path = "../crates/ainm-escrow" }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"

tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
anyhow = "1"
rand = "0.8"

# Sandboxing (sub-project D): setrlimit in a pre_exec closure (async-signal-safe)
libc = "0.2"

# Sandboxing (sub-project D): memfd_create for passing the seccomp BPF to bwrap
nix = { version = "0.29", features = ["fs", "mman"] }

# Federation: HTTP client for server-to-server relay
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }

# Federation: TLS configuration (direct dep for mTLS ServerConfig)
rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio-rustls = "0.26"
rustls-pki-types = { version = "1.14", features = ["std"] }

# CLI argument parsing for federation mode
clap = { version = "4.6", features = ["derive"] }

# Persistent embedded storage for offline queue, dedup cache, TOFU pins, thread messages
redb = "3.1"

# PostgreSQL (production persistence for facts, threads, messages, graph)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "uuid", "chrono", "migrate"] }

# Configuration management (layered: TOML + env vars)
figment = { version = "0.10", features = ["toml", "env"] }

# Typed errors at layer boundaries
thiserror = "2"

# Ephemeral tempdir for --uat mode (Phase 14-02)
tempfile = "3"

# Async trait support for LLM client abstraction
async-trait = "0.1"

# Curated MCP bridge (B-9): connect to trusted MCP servers behind the ToolProvider trait.
# rmcp types are confined to McpClientHandle in src/mcp.rs (the sub-project-D isolation seam).
rmcp = { version = "1.7", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

# HTTP server for federation TLS listener (low-level hyper for axum TLS integration)
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = "0.5"
hex = "0.4"

# Sandboxing (sub-project D): URL parsing for the HTTP-transport SSRF guard
url = "2"
tower_governor = "0.8.0"
governor = "0.10"
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = "0.32.0"
tracing-opentelemetry = "0.33.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Compile the baseline seccomp denylist to BPF (Firecracker's pure-Rust seccomp compiler)
seccompiler = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "generate_vectors"
path = "../tests/vectors/generate_vectors.rs"
